<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohamed Amin</title>
  <meta name="description" content="Mohamed Amin, AI Engineer. Website coming soon.">
  <style>
    :root {
      --bg: #ffffff; --fg: #111111; --muted: #555555; --link: #0a66c2;
      --term-bg: #0f1115; --term-fg: #e6e6e6; --term-accent: #3fb950; --term-border: transparent;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115; --fg: #f2f2f2; --muted: #a0a0a0; --link: #70b5f9;
        --term-bg: #161b22; --term-border: #30363d;
      }
    }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; text-align: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 0 16px;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0; }
    p  { color: var(--muted); font-size: 1.2rem; margin: .5rem 0 1.5rem; }
    .contact { font-size: 1rem; margin: 0; }
    a  { color: var(--link); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }

    /* Terminal line that types "building mohamedamin.me" on a loop */
    .terminal {
      display: inline-block; margin: 0 0 1.5rem; padding: .75rem 1.25rem;
      width: 26ch; /* "$ " + 23 typed chars + cursor, so the box never resizes */
      background: var(--term-bg); color: var(--term-fg);
      border: 1px solid var(--term-border); border-radius: 8px;
      font: .95rem/1.4 ui-monospace, "Cascadia Code", Consolas, monospace;
      text-align: left;
    }
    .prompt { color: var(--term-accent); }
    .typed {
      display: inline-block; vertical-align: bottom;
      overflow: hidden; white-space: nowrap;
      width: 23ch; /* length of "building mohamedamin.me" */
      animation: type 4s steps(23) infinite;
    }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes type {
      0%       { width: 0; }
      45%, 90% { width: 23ch; }
      100%     { width: 0; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .typed, .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Mohamed Amin</h1>
    <p>AI Engineer</p>
    <div class="terminal" role="img" aria-label="Website coming soon">
      <span class="prompt">$</span>
      <span class="typed">building mohamedamin.me</span><span class="cursor">▌</span>
    </div>
    <p class="contact">
      Contact me on
      <a href="https://www.linkedin.com/in/mohamedgamin" target="_blank" rel="noopener">LinkedIn →</a>
    </p>
  </main>
</body>
</html>
