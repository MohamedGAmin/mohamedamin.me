<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mohamed Amin</title>
  <meta name="description" content="Mohamed Amin, AI Engineer.">
  <style>
    :root { --bg: #ffffff; --fg: #111111; --muted: #555555; --link: #0a66c2; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1115; --fg: #f2f2f2; --muted: #a0a0a0; --link: #70b5f9; }
    }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; text-align: center;
      background: var(--bg); color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 0 16px;
    }
    h1 { font-size: clamp(2rem, 6vw, 3rem); margin: 0; }
    p  { color: var(--muted); font-size: 1.2rem; margin: .5rem 0 1.5rem; }
    a  { color: var(--link); text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>Mohamed Amin</h1>
    <p>AI Engineer</p>
    <a href="https://www.linkedin.com/in/mohamedgamin" target="_blank" rel="noopener">LinkedIn →</a>
  </main>
</body>
</html>
